name: Check CouchDB Status

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Docker + CouchDB
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "=== Docker containers ==="
            docker ps -a --filter "name=obsidian_sync"

            echo ""
            echo "=== CouchDB logs (last 30 lines) ==="
            docker logs obsidian_sync --tail 30 2>&1 || echo "Container not found"

            echo ""
            echo "=== CouchDB health check (internal) ==="
            docker exec obsidian_sync curl -sf http://localhost:5984/ 2>&1 || echo "curl failed inside container"

            echo ""
            echo "=== .env exists? ==="
            ls -la /opt/obsidianRemote/.env

            echo ""
            echo "=== local.ini exists? ==="
            ls -la /opt/obsidianRemote/couchdb/config/
