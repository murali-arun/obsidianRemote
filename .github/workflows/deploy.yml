name: Deploy Obsidian LiveSync (CouchDB)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "docker-compose.yml"
      - "couchdb/local.ini"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure target dirs exist
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            mkdir -p /opt/obsidianRemote/couchdb/data
            mkdir -p /opt/obsidianRemote/couchdb/config

      - name: Upload docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.yml"
          target: "/opt/obsidianRemote/"
          overwrite: true

      - name: Upload CouchDB config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "couchdb/local.ini"
          target: "/opt/obsidianRemote/couchdb/config/"
          strip_components: 1
          overwrite: true

      - name: Write .env from secrets
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: COUCHDB_USER,COUCHDB_PASSWORD
          script: |
            set -e
            cat > /opt/obsidianRemote/.env <<EOF
            COUCHDB_USER=$COUCHDB_USER
            COUCHDB_PASSWORD=$COUCHDB_PASSWORD
            EOF
            chmod 600 /opt/obsidianRemote/.env
        env:
          COUCHDB_USER: ${{ secrets.COUCHDB_USER }}
          COUCHDB_PASSWORD: ${{ secrets.COUCHDB_PASSWORD }}

      - name: Pull + restart CouchDB
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/obsidianRemote

            docker network ls | grep -q npm_default || docker network create npm_default

            docker-compose pull
            docker-compose up -d

            docker ps --filter "name=obsidian_sync" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
